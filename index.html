<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>AAM Livestock</title>
<meta name="theme-color" content="#22392F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AAM Livestock">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F3F0; --card:#FFFFFF;
  --ink:#181C19; --soft:#6A6F6B; --faint:#9DA29E;
  --line:#E5E3DE; --hair:#EFEEEA;
  --green:#22392F; --green2:#3A5A4A; --gold:#A8813C;
  --red:#9A3B2C;
  --fd:'Jost',-apple-system,sans-serif;
  --fb:'Inter',-apple-system,sans-serif;
  --bar:60px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
button{font-family:var(--fb);border:none;background:none;color:inherit;cursor:pointer}
h1,h2,h3,h4{font-family:var(--fd);font-weight:500;margin:0;line-height:1.25}
.eyebrow{font-family:var(--fd);font-size:.63rem;text-transform:uppercase;letter-spacing:.14em;color:var(--faint);font-weight:500}
.mono{font-family:var(--fd)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ============ SHELL ============ */
.app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;background:var(--bg);box-shadow:0 0 60px rgba(0,0,0,.09)}

.appbar{
  flex:none;background:var(--green);color:#fff;
  padding:calc(var(--sat) + 10px) 8px 10px;
  display:flex;align-items:center;gap:4px;user-select:none;z-index:20;
}
.appbar h1{font-size:1.06rem;font-weight:500;flex:1;padding-left:8px;letter-spacing:.01em}
.abtn{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:#fff;flex:none;transition:background .15s}
.abtn:active{background:rgba(255,255,255,.16)}
.abtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--gold);position:absolute;top:9px;right:9px}

.screens{flex:1;position:relative;overflow:hidden}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 0 22px;display:none}
.screen.on{display:block}

.tabbar{
  flex:none;background:#fff;border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);
  padding-bottom:var(--sab);user-select:none;z-index:20;
}
.tab{height:var(--bar);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);position:relative;transition:color .15s}
.tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-family:var(--fd);font-size:.6rem;letter-spacing:.05em;text-transform:uppercase}
.tab.on{color:var(--green)}
.tab.on svg{stroke-width:2}
.tab:active{transform:scale(.93)}
.badge{position:absolute;top:7px;right:calc(50% - 20px);background:var(--gold);color:#fff;font-family:var(--fd);font-size:.58rem;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px}

/* ============ PULL TO REFRESH ============ */
.ptr{position:absolute;top:0;left:0;right:0;height:0;display:grid;place-items:center;overflow:hidden;z-index:5;color:var(--faint)}
.ptr svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.ptr.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ CHIPS ============ */
.chiprow{display:flex;gap:7px;overflow-x:auto;padding:12px 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 14px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:.8rem;color:var(--soft);white-space:nowrap;transition:all .15s}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:500}

.searchwrap{padding:0 16px 4px}
.search{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:0 13px}
.search svg{width:17px;height:17px;stroke:var(--faint);fill:none;stroke-width:1.8;flex:none}
.search input{flex:1;border:none;background:none;padding:12px 0;font-size:.92rem;font-family:var(--fb);color:var(--ink);outline:none}
.search input::placeholder{color:var(--faint)}

.sechead{padding:16px 16px 9px;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sechead .n{font-family:var(--fd);font-size:.72rem;color:var(--faint);letter-spacing:.05em}

/* ============ CARDS ============ */
.list{padding:0 16px;display:flex;flex-direction:column;gap:12px}

.salecard{background:var(--card);border-radius:14px;overflow:hidden;display:flex;transition:transform .12s;box-shadow:0 1px 2px rgba(24,28,25,.05)}
.salecard:active{transform:scale(.985)}
.salecard .thumb{width:104px;flex:none;background:#D8D5CE center/cover no-repeat;position:relative}
.salecard .datetag{position:absolute;left:0;top:0;background:var(--green);color:#fff;padding:6px 0;width:44px;text-align:center;font-family:var(--fd);line-height:1.05;border-bottom-right-radius:10px}
.salecard .datetag i{display:block;font-style:normal;font-size:.56rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.salecard .datetag b{display:block;font-size:1.1rem;font-weight:500}
.salecard .body{flex:1;padding:13px 14px;min-width:0}
.salecard h3{font-size:1rem;margin-bottom:5px}
.salecard .meta{font-size:.79rem;color:var(--soft);display:flex;gap:5px;align-items:center;margin-bottom:2px}
.salecard .meta svg{width:13px;height:13px;stroke:var(--faint);fill:none;stroke-width:1.8;flex:none}
.tagline{display:inline-block;font-family:var(--fd);font-size:.58rem;text-transform:uppercase;letter-spacing:.13em;padding:3px 8px;border-radius:4px;background:var(--hair);color:var(--soft);margin-bottom:7px}
.tagline.prod{background:#F6EEDF;color:var(--gold)}

.stockcard{background:var(--card);border-radius:14px;overflow:hidden;transition:transform .12s;box-shadow:0 1px 2px rgba(24,28,25,.05);position:relative}
.stockcard:active{transform:scale(.985)}
.stockcard .ph{aspect-ratio:16/10;background:#D8D5CE center/cover no-repeat;position:relative}
.stockcard .lot{position:absolute;top:9px;left:9px;background:rgba(24,28,25,.78);color:#fff;font-family:var(--fd);font-size:.6rem;letter-spacing:.1em;padding:4px 8px;border-radius:5px}
.heart{position:absolute;top:7px;right:7px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;z-index:3}
.heart svg{width:18px;height:18px;stroke:var(--soft);fill:none;stroke-width:1.7}
.heart.on svg{stroke:var(--red);fill:var(--red)}
.heart:active{transform:scale(.88)}
.stockcard .body{padding:12px 14px 14px}
.stockcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:3px}
.stockcard h3{font-size:1.02rem}
.stockcard .price{font-family:var(--fd);font-size:1.02rem;font-weight:600;color:var(--green);white-space:nowrap}
.stockcard .sub{font-size:.79rem;color:var(--soft)}

.empty{margin:28px 16px;padding:40px 20px;text-align:center;color:var(--faint);font-size:.87rem;background:#fff;border-radius:14px}
.empty b{display:block;font-family:var(--fd);font-weight:500;font-size:1.02rem;color:var(--ink);margin-bottom:5px}

/* skeleton */
.sk{background:#fff;border-radius:14px;height:104px;display:flex;overflow:hidden}
.sk i{display:block;background:linear-gradient(90deg,#EDECE8 25%,#F6F5F2 50%,#EDECE8 75%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk .a{width:104px;height:100%}
.sk .b{flex:1;padding:15px 14px;display:flex;flex-direction:column;gap:9px}
.sk .b i{height:11px;border-radius:4px}

/* ============ CALENDAR ============ */
.calwrap{background:#fff;margin:14px 16px;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(24,28,25,.05)}
.caltop{display:flex;align-items:center;justify-content:space-between;padding:13px 10px 13px 16px}
.caltop h3{font-size:1.02rem}
.caltop .nav{display:flex;gap:2px}
.caltop .nav button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--soft);font-size:1.1rem}
.caltop .nav button:active{background:var(--hair)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);padding:0 6px 4px}
.dow span{text-align:center;font-family:var(--fd);font-size:.6rem;letter-spacing:.1em;color:var(--faint);text-transform:uppercase}
.days{display:grid;grid-template-columns:repeat(7,1fr);padding:0 6px 10px;gap:2px}
.dcell{aspect-ratio:1;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:var(--fd);font-size:.88rem;color:var(--ink);transition:background .12s}
.dcell.blank{visibility:hidden}
.dcell:active{background:var(--hair)}
.dcell.today{color:var(--gold);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--gold)}
.dcell.sel{background:var(--green);color:#fff}
.dcell.sel .dt{background:#fff}
.dcell .dots{display:flex;gap:2.5px;height:4px}
.dcell .dt{width:4px;height:4px;border-radius:50%;background:var(--gold)}
.dayhead{padding:18px 16px 4px}
.dayhead h3{font-size:1.18rem;margin-top:3px}

/* ============ DETAIL STACK ============ */
.detail{
  position:fixed;inset:0;background:var(--bg);z-index:60;
  max-width:520px;margin:0 auto;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  visibility:hidden;
}
.detail.open{transform:translateX(0);visibility:visible}
.detail .dbar{
  flex:none;background:var(--green);color:#fff;padding:calc(var(--sat) + 10px) 8px 10px;
  display:flex;align-items:center;gap:4px;
}
.detail .dbar h2{flex:1;font-size:1.02rem;font-weight:500;padding-left:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dscroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(24px + var(--sab))}

.dhero{aspect-ratio:16/10;background:#D8D5CE center/cover no-repeat;position:relative}
.dhero .over{position:absolute;left:0;bottom:0;right:0;padding:16px;background:linear-gradient(transparent,rgba(18,24,20,.8));color:#fff}
.dhero .over h2{font-size:1.4rem;font-weight:500;margin-top:6px}
.dbody{padding:18px 16px}
.drow{display:flex;gap:12px;padding:13px 0;border-bottom:1px solid var(--hair);align-items:flex-start}
.drow:last-child{border-bottom:none}
.drow svg{width:18px;height:18px;stroke:var(--faint);fill:none;stroke-width:1.7;flex:none;margin-top:2px}
.drow .k{font-size:.68rem;text-transform:uppercase;letter-spacing:.11em;color:var(--faint);font-family:var(--fd);margin-bottom:2px}
.drow .v{font-size:.94rem}
.drow .v a{color:var(--green2)}
.dnote{background:#fff;border-radius:12px;padding:15px;font-size:.9rem;color:var(--soft);margin-top:14px}
.dcard{background:#fff;border-radius:14px;padding:4px 16px;margin-bottom:14px;box-shadow:0 1px 2px rgba(24,28,25,.05)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}
.actions.three{grid-template-columns:1fr 1fr 1fr}
.act{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-family:var(--fd);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--green);text-decoration:none;transition:transform .12s}
.act:active{transform:scale(.95)}
.act svg{width:20px;height:20px;stroke:var(--green);fill:none;stroke-width:1.7}
.act.primary{background:var(--green);color:#fff;border-color:var(--green)}
.act.primary svg{stroke:#fff}
.bigprice{font-family:var(--fd);font-size:1.9rem;font-weight:600;color:var(--green);padding:4px 0 2px}

/* ============ SHEET ============ */
.scrim{position:fixed;inset:0;background:rgba(18,24,20,.42);z-index:70;opacity:0;visibility:hidden;transition:opacity .22s}
.scrim.open{opacity:1;visibility:visible}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:71;background:#fff;
  border-radius:18px 18px 0 0;max-width:520px;margin:0 auto;
  padding:8px 16px calc(20px + var(--sab));
  transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
  max-height:82vh;overflow-y:auto;
}
.sheet.open{transform:translateY(0)}
.grab{width:38px;height:4px;background:var(--line);border-radius:2px;margin:6px auto 14px}
.sheet h3{font-size:1.1rem;margin-bottom:14px}
.opt{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--hair);font-size:.95rem}
.opt:last-of-type{border-bottom:none}
.opt.on{color:var(--green);font-weight:600}
.opt svg{width:18px;height:18px;stroke:var(--green);fill:none;stroke-width:2.2}

/* ============ TOAST ============ */
#toast{position:fixed;left:16px;right:16px;bottom:calc(var(--bar) + var(--sab) + 14px);z-index:90;max-width:488px;margin:0 auto;pointer-events:none}
.toast{background:#181C19;color:#fff;border-radius:11px;padding:13px 16px;font-size:.87rem;box-shadow:0 8px 26px rgba(0,0,0,.24);transform:translateY(20px);opacity:0;transition:all .25s;display:flex;gap:9px;align-items:center}
.toast.up{transform:translateY(0);opacity:1}
.toast.err{background:var(--red)}
.toast svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2;flex:none}

/* ============ FORMS ============ */
.form{padding:4px 16px 20px}
.fld{margin-bottom:15px}
.fld label{display:block;font-family:var(--fd);font-size:.66rem;text-transform:uppercase;letter-spacing:.12em;color:var(--faint);margin-bottom:6px}
.fld .hint{font-size:.76rem;color:var(--faint);margin-top:5px}
input,select,textarea{width:100%;font-family:var(--fb);font-size:16px;padding:13px 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);outline:none;-webkit-appearance:none}
input:focus,select:focus,textarea:focus{border-color:var(--green)}
textarea{min-height:88px;resize:vertical}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236A6F6B' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 13px center;background-size:17px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.btn{width:100%;background:var(--green);color:#fff;border-radius:12px;padding:15px;font-family:var(--fd);font-size:.82rem;text-transform:uppercase;letter-spacing:.13em;font-weight:500;transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:#fff;color:var(--green);border:1px solid var(--line)}
.btn.warn{background:#fff;color:var(--red);border:1px solid rgba(154,59,44,.3)}
.btn.sm{width:auto;padding:9px 15px;font-size:.66rem;border-radius:9px}
.seg{display:flex;background:var(--hair);border-radius:11px;padding:3px;margin-bottom:18px}
.seg button{flex:1;padding:10px;border-radius:9px;font-family:var(--fd);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--soft)}
.seg button.on{background:#fff;color:var(--green);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.07)}

.rowitem{background:#fff;border-radius:13px;padding:12px 14px;display:flex;gap:12px;align-items:center;margin-bottom:10px}
.rowitem .th{width:64px;height:52px;border-radius:9px;background:#D8D5CE center/cover no-repeat;flex:none}
.rowitem .dchip{width:52px;flex:none;text-align:center;background:var(--green);color:#fff;border-radius:9px;padding:7px 0;font-family:var(--fd);line-height:1.05}
.rowitem .dchip i{display:block;font-style:normal;font-size:.54rem;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.72)}
.rowitem .dchip b{display:block;font-size:1.02rem;font-weight:500}
.rowitem .info{flex:1;min-width:0}
.rowitem h4{font-size:.95rem;margin-bottom:2px}
.rowitem .m{font-size:.76rem;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowitem .acts{display:flex;gap:7px;flex:none}
.past{font-family:var(--fd);font-size:.55rem;text-transform:uppercase;letter-spacing:.1em;background:var(--hair);color:var(--faint);padding:2px 6px;border-radius:4px;margin-left:6px}
.statuspill{font-family:var(--fd);font-size:.58rem;text-transform:uppercase;letter-spacing:.11em;padding:3px 8px;border-radius:5px}
.statuspill.pending{background:#F6EEDF;color:var(--gold)}
.statuspill.live{background:#E7EFE9;color:var(--green)}
.statuspill.rejected{background:#F7E9E6;color:var(--red)}
.subhead{padding:20px 16px 8px;font-family:var(--fd);font-size:.66rem;text-transform:uppercase;letter-spacing:.13em;color:var(--faint)}
</style>
</head>
<body>

<div class="app">
  <header class="appbar">
    <button class="abtn" id="backOrLogo" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <h1 id="barTitle">Sales</h1>
    <button class="abtn" id="barSearch" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></button>
    <button class="abtn" id="barFilter" aria-label="Filter" style="position:relative">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
      <span class="dot-live" id="filterDot" style="display:none"></span>
    </button>
  </header>

  <div class="screens">
    <div class="ptr" id="ptr"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-3-6.7"/><path d="M21 4v5h-5"/></svg></div>

    <!-- ===== SALES ===== -->
    <section class="screen on" id="s-sales">
      <div class="chiprow" id="saleChips"></div>
      <div class="sechead"><span class="eyebrow">Upcoming</span><span class="n" id="saleCount"></span></div>
      <div class="list" id="saleList"></div>
    </section>

    <!-- ===== MARKET ===== -->
    <section class="screen" id="s-market">
      <div class="searchwrap" id="mktSearchWrap" style="display:none;padding-top:12px">
        <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
          <input id="mktSearch" placeholder="Search breed, type or area" autocomplete="off"></div>
      </div>
      <div class="chiprow" id="mktChips"></div>
      <div class="sechead"><span class="eyebrow">Private treaty</span><span class="n" id="mktCount"></span></div>
      <div class="list" id="mktList"></div>
    </section>

    <!-- ===== CALENDAR ===== -->
    <section class="screen" id="s-cal">
      <div class="calwrap">
        <div class="caltop">
          <h3 id="calMonth"></h3>
          <div class="nav">
            <button id="pm" aria-label="Previous month">‹</button>
            <button id="tm" aria-label="Today" style="width:auto;padding:0 12px;font-family:var(--fd);font-size:.66rem;letter-spacing:.1em;text-transform:uppercase">Today</button>
            <button id="nm" aria-label="Next month">›</button>
          </div>
        </div>
        <div class="dow"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
        <div class="days" id="calDays"></div>
      </div>
      <div class="dayhead"><span class="eyebrow" id="dayLbl"></span><h3 id="dayTitle"></h3></div>
      <div class="list" id="dayList"></div>
    </section>

    <!-- ===== SELL ===== -->
    <section class="screen" id="s-sell">
      <div id="sellAuth">
        <div class="form" style="padding-top:22px">
          <div class="seg"><button id="tIn" class="on">Log in</button><button id="tUp">Create account</button></div>
          <div class="fld"><label for="aEmail">Email</label><input type="email" id="aEmail" autocomplete="email"></div>
          <div class="fld"><label for="aPass">Password</label><input type="password" id="aPass" autocomplete="current-password"><div class="hint">At least 6 characters.</div></div>
          <button class="btn" id="doAuth">Log in</button>
          <button class="btn ghost" id="doReset" style="margin-top:10px">Forgot password</button>
        </div>
      </div>

function icsFor(e){
  const v=V(e.ven), dt=s=>e.date.replace(/-/g,"")+"T"+(s||"09:00").replace(":","")+"00";
  return "data:text/calendar;charset=utf-8,"+encodeURIComponent(
    ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Midlands Livestock//EN","BEGIN:VEVENT",
    "UID:"+e.id+"@midlands.demo","DTSTART:"+dt(e.start),"DTEND:"+dt(e.end||e.start),
    "SUMMARY:"+e.title,"LOCATION:"+v.name+(v.town?", "+v.town:""),
    "DESCRIPTION:"+(e.note||"").replace(/\n/g," "),"END:VEVENT","END:VCALENDAR"].join("\r\n"));
}
function gcalFor(e){
  const v=V(e.ven), dt=s=>e.date.replace(/-/g,"")+"T"+(s||"09:00").replace(":","")+"00";
  return "https://www.google.com/calendar/event?"+new URLSearchParams({action:"TEMPLATE",text:e.title,
    dates:dt(e.start)+"/"+dt(e.end||e.start),location:v.name+(v.town?", "+v.town:""),details:e.note||""});
}

/* ---------- toast ---------- */
let tTimer;
function toast(msg,err){
  const t=document.createElement("div");
  t.className="toast"+(err?" err":"");
  t.innerHTML=(err?IC.alert:IC.check)+"<span>"+esc(msg)+"</span>";
  $("toast").innerHTML=""; $("toast").appendChild(t);
  requestAnimationFrame(()=>t.classList.add("up"));
  clearTimeout(tTimer);
  tTimer=setTimeout(()=>{t.classList.remove("up");setTimeout(()=>t.remove(),300);},2600);
}

function drawCal(){
  const first=new Date(vy,vm,1),dim=new Date(vy,vm+1,0).getDate(),off=(first.getDay()+6)%7;
  $("calMonth").textContent=first.toLocaleString("en-GB",{month:"long",year:"numeric"});
  let h="";
  for(let i=0;i<off;i++)h+=`<div class="dcell blank"></div>`;
  for(const d of rand(1,dim)){
    const ds=iso(new Date(vy,vm,d)),ev=on(ds),c=["dcell"];
    if(ds===TODAY)c.push("today"); if(ds===sel)c.push("sel");
    h+=`<button class="${c.join(" ")}" onclick="pick('${ds}')" aria-label="${d}, ${ev.length} sales">
      <span>${d}</span><span class="dots">${ev.slice(0,3).map(()=>`<i class="dt"></i>`).join("")}</span></button>`;
  }
  $("calDays").innerHTML=h;
}

// Phone photos are 3–8 MB; Storage rules cap uploads at 3 MB. Resize and re-encode first.
const shrink=f=>new Promise((ok,no)=>{
  const u=URL.createObjectURL(f),i=new Image();
  i.onload=()=>{
    const k=Math.min(1,1600/Math.max(i.width,i.height)),c=document.createElement("canvas");
    c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);
    c.getContext("2d").drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);
    c.toBlob(b=>b?ok(b):no(new Error("Couldn't read that photo")),"image/jpeg",.82);
  };
  i.onerror=()=>{URL.revokeObjectURL(u);no(new Error("Couldn't read that photo — try a JPEG or PNG"));};
  i.src=u;
});

  if(!b||!p||!n||!ph)return toast("Fill in breed, price, name and phone",1);
  if(herd&&!(q>=2))return toast("Enter how many head are in the herd (2 or more)",1);
  if(!(Number(p)>0))return toast("Enter a price above zero",1);
  const f=$("n_img").files[0],btn=$("n_go");
  btn.disabled=true;btn.textContent=f?"Uploading photo…":"Submitting…";
  try{

    if(f){
      const r=sref(storage,`listings/${me.uid}/${Date.now()}.jpg`);
      await uploadBytes(r,await shrink(f),{contentType:"image/jpeg"});

    await addDoc(collection(db,"listings"),{lot:Math.random().toString(36).slice(2,7).toUpperCase(),breed:b,type:$("n_type").value,qty:herd?q:null,

      status:"pending",ownerUid:me.uid,createdAt:serverTimestamp()});

    else await addDoc(collection(db,"events"),{img:IMG.herd,...data,createdAt:serverTimestamp()});
  }catch(x){return toast("Couldn't save — "+(x.code||x.message),1);}
  history.back();toast(id?"Event updated":"Event added to the calendar");
  const dt=new Date(d+"T00:00:00");vy=dt.getFullYear();vm=dt.getMonth();
  pick(d);
};
window.delEv=async id=>{
  if(!confirm("Delete this sale event?"))return;
  try{await deleteDoc(doc(db,"events",id));}catch(x){return toast("Couldn't delete — "+(x.code||x.message),1);}
  history.back();toast("Event deleted");
};

function drawVen(){
  $("venList").innerHTML=venues.map(v=>{
    const n=events.filter(e=>e.ven===v.id&&e.date>=TODAY).length;
    return `<div class="rowitem">
      <div class="info"><h4>${esc(v.name)}</h4><div class="m">${esc(v.town)} · ${n} upcoming</div></div>
      <div class="acts"><button class="btn sm ghost" onclick="editVen('${v.id}')">Edit</button></div>
    </div>`;}).join("")||`<div class="empty"><b>No sale yards</b>Add your first venue.${seedBtn()}</div>`;
}
function venForm(v){
  const V0=v||{};
  return `<div class="form" style="padding-top:20px">
    <div class="fld"><label for="y_n">Yard name</label><input id="y_n" value="${esc(V0.name||"")}" placeholder="Mooi River Sale Yard"></div>
    <div class="fld"><label for="y_t">Town / district</label><input id="y_t" value="${esc(V0.town||"")}" placeholder="Mooi River, KZN"></div>
    <div class="fld"><label for="y_c">Office contact</label><input type="tel" id="y_c" value="${esc(V0.contact||"")}"></div>
    <div class="fld"><label for="y_m">Google Maps link</label><input id="y_m" value="${esc(V0.map||"")}" placeholder="https://maps.google.com/…"><div class="hint">Powers the Directions button on every sale here.</div></div>
    <div class="fld"><label for="y_o">Facilities / notes</label><input id="y_o" value="${esc(V0.note||"")}" placeholder="Certified scale, covered pens"></div>
    <button class="btn" onclick="saveVen('${V0.id||""}')">${V0.id?"Save changes":"Add venue"}</button>
    ${V0.id?`<button class="btn warn" style="margin-top:10px" onclick="delVen('${V0.id}')">Delete venue</button>`:""}
  </div>`;
}
$("newVen").onclick=()=>pushDetail("Add sale yard",venForm(null));
window.editVen=id=>pushDetail("Edit sale yard",venForm(venues.find(v=>v.id===id)));
window.saveVen=async id=>{
  const n=$("y_n").value.trim(),t=$("y_t").value.trim();
  if(!n||!t)return toast("Add a yard name and town",1);
  const d={name:n,town:t,contact:$("y_c").value.trim(),map:$("y_m").value.trim(),note:$("y_o").value.trim()};
  try{
    if(id)await updateDoc(doc(db,"venues",id),d);
    else await addDoc(collection(db,"venues"),{...d,createdAt:serverTimestamp()});
  }catch(x){return toast("Couldn't save — "+(x.code||x.message),1);}
  history.back();toast(id?"Yard updated":"Yard added");
};
window.delVen=async id=>{
  const u=events.filter(e=>e.ven===id).length;
  if(!confirm(u?`${u} sale event${u===1?"":"s"} use this yard. Delete anyway?`:"Delete this sale yard?"))return;
  try{await deleteDoc(doc(db,"venues",id));}catch(x){return toast("Couldn't delete — "+(x.code||x.message),1);}
  history.back();toast("Yard deleted");
};

// One-off: copy the starter yards, events and listings into an empty database.
window.seedDemo=async()=>{
  if(!isAdm||!confirm("Load the demo sale yards, events and listings?"))return;
  const b=writeBatch(db),vid={};
  SEED_VENUES.forEach(({id,...v})=>{const r=doc(collection(db,"venues"));vid[id]=r.id;b.set(r,{...v,createdAt:serverTimestamp()});});
  SEED_EVENTS.forEach(({id,ven,...e})=>b.set(doc(collection(db,"events")),{...e,ven:vid[ven],createdAt:serverTimestamp()}));
  SEED_STOCK.forEach(({id,st,mine,...l})=>b.set(doc(collection(db,"listings")),{qty:null,...l,status:st,ownerUid:me.uid,createdAt:serverTimestamp()}));
  try{await b.commit();toast("Demo data loaded");}catch(x){toast("Couldn't load demo data — "+(x.code||x.message),1);}
};

/* ============================================================
   PULL TO REFRESH
   ============================================================ */
let ptrY=0,ptrOn=false;
document.querySelectorAll(".screen").forEach(sc=>{
  sc.addEventListener("touchstart",e=>{if(sc.scrollTop<=0){ptrY=e.touches[0].clientY;ptrOn=true;}},{passive:true});
  sc.addEventListener("touchmove",e=>{
    if(!ptrOn)return;
    const dy=e.touches[0].clientY-ptrY;
    if(dy>0&&sc.scrollTop<=0)$("ptr").style.height=Math.min(dy*.45,56)+"px";
  },{passive:true});
  sc.addEventListener("touchend",()=>{
    if(!ptrOn)return; ptrOn=false;
    const h=parseFloat($("ptr").style.height||0);
    if(h>40){
      $("ptr").classList.add("spin");
      setTimeout(()=>{$("ptr").classList.remove("spin");$("ptr").style.height="0px";refresh();toast("Up to date");},900);
    }else $("ptr").style.height="0px";
  },{passive:true});
});

/* ============================================================
   BOOT
   ============================================================ */
function refresh(){drawChips();drawSales();drawMarket();drawCal();drawEv();drawVen();drawPend();drawMine();if(sel)pick(sel);}

function skeleton(){
  const s=`<div class="sk"><i class="a"></i><div class="b"><i style="width:60%"></i><i style="width:85%"></i><i style="width:40%"></i></div></div>`;
  $("saleList").innerHTML=$("mktList").innerHTML=s+s+s;
}
skeleton();
go("sales");pick(TODAY);

// Public data — each listener redraws only what depends on it.
listen(collection(db,"venues"),r=>{venues=r;loaded.ven=true;drawChips();drawSales();drawEv();drawVen();drawPend();if(sel)pick(sel);});
listen(collection(db,"events"),r=>{events=r;loaded.ev=true;drawSales();drawEv();drawVen();drawPend();if(sel)pick(sel);});
listen(query(collection(db,"listings"),where("status","==","live")),r=>{liveL=r;loaded.live=true;drawChips();drawMarket();});

// Per-user data. Listeners are torn down on every auth change so nothing outlives its session.
function setUser(u){
  me=u;isAdm=!!u&&u.emailVerified&&ADMIN_EMAILS.includes((u.email||"").toLowerCase());
  $("sellAuth").style.display=u?"none":"block";$("sellMain").style.display=u?"block":"none";
  $("admAuth").style.display=isAdm?"none":"block";$("admMain").style.display=isAdm?"block":"none";
  if(unMine)unMine();if(unPend)unPend();unMine=unPend=null;mineL=[];pendL=[];
  if(u)unMine=listen(query(collection(db,"listings"),where("ownerUid","==",u.uid)),r=>{mineL=r;drawMine();});
  if(isAdm)unPend=listen(query(collection(db,"listings"),where("status","==","pending")),r=>{pendL=r;drawPend();});
  drawMine();drawPend();drawEv();drawVen();
}
onAuthStateChanged(auth,setUser);

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
